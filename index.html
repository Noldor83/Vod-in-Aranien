<!DOCTYPE html>
<html lang="de">
<head>

<style>
html,body{margin:0;height:100%;background:#06080e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Georgia,'Times New Roman',serif;color:#d8d2c4}

#hud{position:absolute;left:0;top:0;right:0;display:flex;gap:1.1em;align-items:center;padding:.35em .6em;font-size:var(--fs,14px);text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none;letter-spacing:.02em}

.bubble:after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#e9e1cf}
.bubble.npc{background:#cfd6e4}
.bubble.npc:after{border-top-color:#cfd6e4}

@keyframes rot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}

.pad button.on{background:rgba(216,190,120,.4)}
.pad.right button[data-k=jump],.pad.right button[data-k=attack]{width:78px;height:78px}

@keyframes orb{from{transform:rotate(0deg) translateX(22px) rotate(0deg)}to{transform:rotate(360deg) translateX(22px) rotate(-360deg)}}
.card .ititle{font-style:italic;color:#c9a65c;text-align:center;margin:6px 0 0;font-size:15px}
.card .nm{display:flex;align-items:center;gap:8px;margin:12px 0 2px;color:#b9b3a6;font-size:14px}
.card .nm input{flex:1;min-width:0;padding:8px 10px;font:600 16px Georgia,serif;color:#e8e0cc;background:#10111a;border:1px solid #4a4a5a;border-radius:7px}

@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card table.hs{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;color:#d8d0bc}

.card{max-width:440px;width:100%;background:#1a1b24;border:1px solid #3a3a48;border-radius:12px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6)}

#logo{position:absolute;left:50%;top:.15em;transform:translateX(-50%);font-family:'UnifrakturMaguntia',Georgia,serif;font-size:calc(var(--fs,14px)*1.55);color:#e2d3a8;text-shadow:0 0 6px #000,0 2px 3px #000;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:.3em}

#atText{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;font-style:italic;font-size:calc(var(--fs,14px)*1.15);color:#f0e2c0;text-shadow:0 0 6px #000,0 2px 3px #000;opacity:0;transition:opacity .6s;line-height:1.35}
#atTitle{position:absolute;left:0;right:0;top:16%;text-align:center;font-family:'UnifrakturMaguntia',Georgia,serif;font-size:calc(var(--fs,14px)*3.6);color:#f2dfae;text-shadow:0 0 14px #a01010,0 3px 4px #000;opacity:0;transition:opacity 1.2s,transform 1.2s;transform:scale(1.15)}

.crest img{width:54px;image-rendering:pixelated}
.card h1.fr{font-size:34px;text-align:center}
.card h1.fr+h2{text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv" width="320" height="192"></canvas>
    <div id="hud"><span id="hHearts"></span><span id="hCoins"></span><span id="hCit"></span><span id="hTime"></span></div>
    <div id="logo"><img alt="" id="logoImg">Boronsberg</div>
    <div id="bossbar" style="display:none"><div class="bn">Der Häuter</div><div class="bb"><div id="bossFill"></div></div></div>
    <div id="attract"><div id="atTitle">Vod von Boronsberg</div><div id="atSub">ALRIGIOS BEFREIUNG</div><div id="atText"></div><div id="atNames"><span style="left:14%">Der Häuter</span><span style="left:38%">Jashild</span><span style="left:62%">Zarion</span><span style="left:86%">Donation</span></div><div id="atPress">TIPPEN ZUM STARTEN</div><div id="atSkip">Tippen = weiter</div></div>
    <div id="toast"><div class="t1">Vod von Boronsberg</div><div class="t2">Welt 1 · Der Basar von Malquis</div></div>
    <audio id="music" loop preload="none"></audio>
    <div id="topBtns"><button id="bFull" title="Vollbild">⛶</button><button id="bMute" title="Ton an/aus">Ton</button><button id="bPause" title="Pause">II</button></div>
    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  </div>
</div>
<div id="rotate"><div class="ph"></div><div>Bitte das Handy quer halten</div><div style="font-size:14px;color:#9a9484">Vod braucht Platz zum Kämpfen.</div></div>
<div id="touch">
  <div class="pad left"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="pad right"><button data-k="attack">Rapier</button><div class="col"><button data-k="jump">Sprung</button><button data-k="down">Ducken</button></div></div>
</div>
<div id="screen"><div class="card" id="card"></div></div>

<script>
(()=>{
'use strict';
const VW=320, VH=192, TS=16, LH=12; let LW=190;
const cv=document.getElementById('cv'); const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const gameEl=document.getElementById('game');

/* ================= Sound ================= */
const sfx=(()=>{
  let ac=null, master=null, muted=false;
  function init(){ if(ac) return; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=0.42; master.connect(ac.destination);}catch(e){ac=null;} }
  function tone(f1,f2,dur,type,vol,delay){ if(!ac||muted) return; const t=ac.currentTime+(delay||0); const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03); }
  function noise(dur,vol,delay){ if(!ac||muted) return; const t=ac.currentTime+(delay||0); const len=Math.max(1,Math.floor(ac.sampleRate*dur)); const buf=ac.createBuffer(1,len,ac.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len); const s=ac.createBufferSource(); s.buffer=buf; const g=ac.createGain(); g.gain.value=vol||0.06; s.connect(g); g.connect(master); s.start(t); }
  return {
    ctx(){ return ac; }, out(){ return master; },
    init, resume(){ if(ac&&ac.state==='suspended') ac.resume(); },
    toggle(){ muted=!muted; return muted; }, isMuted(){return muted;},
    jump(){tone(260,520,0.12,'square',0.045);},
    jump2(){tone(420,880,0.14,'square',0.04);},
    coin(){tone(988,0,0.06,'square',0.035); tone(1319,0,0.12,'square',0.035,0.06);},
    bounce(){tone(170,700,0.2,'triangle',0.1);},
    swing(){noise(0.08,0.05);},
    stun(){tone(720,180,0.16,'square',0.05);},
    hurt(){tone(230,70,0.28,'sawtooth',0.07);},
    brk(){noise(0.2,0.1);},
    steal(){tone(820,280,0.22,'square',0.05);},
    bark(){tone(420,250,0.08,'sawtooth',0.05); tone(420,230,0.08,'sawtooth',0.05,0.11);},
    alert(){tone(880,0,0.07,'square',0.05); tone(880,0,0.07,'square',0.05,0.11);},
    rescue(){[523,659,784,1047].forEach((f,i)=>tone(f,0,0.13,'triangle',0.07,i*0.09));},
    check(){[392,494,587].forEach((f,i)=>tone(f,0,0.15,'triangle',0.07,i*0.1));},
    win(){[392,494,587,784,587,784,988].forEach((f,i)=>tone(f,0,0.2,'triangle',0.08,i*0.13));},
    slide(){noise(0.22,0.035);},
    heart(){tone(660,990,0.22,'triangle',0.07);},
    land(){noise(0.05,0.03);},
    grab(){tone(600,900,0.08,'triangle',0.05);},
    splash(){noise(0.25,0.08); tone(300,120,0.2,'sine',0.05);},
    fire(){noise(0.2,0.07); tone(200,600,0.25,'sawtooth',0.05);},
    tp(){tone(900,200,0.3,'triangle',0.06);},
    crack(){noise(0.06,0.12); tone(2400,900,0.07,'square',0.05);},
    kill(){tone(320,60,0.3,'sawtooth',0.07); noise(0.15,0.06);},
    clang(){tone(1400,900,0.12,'square',0.05); tone(2100,1500,0.1,'square',0.03);},
    roar(){tone(140,70,0.6,'sawtooth',0.09); noise(0.4,0.05);},
    thud(){tone(90,40,0.35,'sine',0.14); noise(0.25,0.09);},
    bossHit(){tone(260,120,0.18,'sawtooth',0.08); noise(0.1,0.06);},
    swing2(){noise(0.18,0.08); tone(500,180,0.18,'triangle',0.05);}
  };
})();

/* ================= Sprites ================= */
const PAL={'+':'#e890b0','*':'#b8607a','%':'#3a1a3a',i:'#5a2a8a',L:'#9a5ad0','9':'#2c3866','0':'#b070ff','1':'#6e7e5a','2':'#48543a','3':'#5c4a3a','4':'#3a2e24','5':'#e2ddcc','6':'#a8a490','7':'#d8ff6a','8':'#c06e2c',A:'#2a4a8e',F:'#16224e',Z:'#6a1a12',X:'#b4361c',I:'#c0121c',U:'#2e0c08',K:'#151116',N:'#3a2414',Y:'#ece2f2',P:'#b8385c',O:'#7e2242',E:'#ff3a2a',Q:'#2a2a30',V:'#5a1a20',W:'#2a1418',a:'#3b2416',j:'#c8895a',J:'#9a6440',m:'#2f2b2e',M:'#59535a',z:'#d01e2c',n:'#5a3a22',G:'#b8903c',k:'#0e0b12',h:'#1c181e',H:'#36303a',f:'#ece6d6',s:'#e0a982',S:'#b07a58',b:'#4a3324',c:'#931f2a',C:'#5e1219',t:'#4f6c8c',T:'#37506b',g:'#c09a44',p:'#3c3f50',B:'#4c3626',w:'#cdd5de',d:'#4a3a30',D:'#1a120e',q:'#2b2433',r:'#a01e22',u:'#d6cfbe',v:'#3a5a84',l:'#8a5a82',o:'#b8ab92',R:'#9a8458',e:'#cdd5de',x:'#6a6a72',y:'#b8c0cc'};
function mk(rows){ const c=document.createElement('canvas'); c.width=rows[0].length; c.height=rows.length; const g=c.getContext('2d'); rows.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const ch=row[x]; if(ch!=='.'&&PAL[ch]){ g.fillStyle=PAL[ch]; g.fillRect(x,y,1,1);} } }); return c; }
const VUP=["......ff............",".....ffff...........","....fffhhhhh........","......khhhhhhk......","..khhhhhhhhhhhhhk...","...kkHHHHHHHHHkk....",".....aaajjjjjk......","....aaajjkjjJk......","....aaajjjjjjJk.....","....aaaajaaajk......","....aaaa.kaaak......","...cCaaakmmmmk......","..cCCaamMmmmmMk.....","..cCCcmmmmzMmmj.....","..cCCcmMmmmmMmj.....","..cCCcmmmMmmmmk.....","..cCCcnnngnnnnk.....","..cCCcmmmmMmmk......","..GcCcmmmmmmmk......","...GCcppppppppk....."];
const LEGS={
 stand:[".....Cppp..pppk.....","......ppp..ppp......","......ppp..ppp......","......ppp..ppp......","......ppp..ppp......","......BBB..BBB......","......BBB..BBB......","......BBBB.BBBB....."],
 a:[".....Cppp...ppk.....",".....ppp.....ppp....","....ppp.......ppp...","....ppp........pp...","...ppp.........pp...","...BBB.........BBB..","..BBBB.........BBB..","..BBB...........BBB."],
 b:[".....Cppp.ppk.......","......ppp.ppp.......",".......pppppp.......",".......ppp.ppp......",".......ppp..BBB.....",".......BBB..BBB.....",".......BBB..........",".......BBBB........."],
 jump:[".....Cppp..pppk.....",".....ppp....ppp.....","....ppp......ppp....","....BBB.......BBB...","....BBB.......BBB...","...BBB..............","....................","...................."]};
function outlined(c,col){ const o=document.createElement('canvas'); o.width=c.width+2; o.height=c.height+2; const g=o.getContext('2d'); const sil=document.createElement('canvas'); sil.width=c.width; sil.height=c.height; const sg=sil.getContext('2d'); sg.drawImage(c,0,0); sg.globalCompositeOperation='source-in'; sg.fillStyle=col; sg.fillRect(0,0,c.width,c.height); for(const [dx,dy] of [[0,1],[2,1],[1,0],[1,2]]) g.drawImage(sil,dx,dy); g.drawImage(c,1,1); return o; }
const SPR={

/* ================= Physics ================= */
function move(e,dt){
  e.hitWall=0;
  let nx=e.x+e.vx*dt;
  const y0=Math.floor(e.y/TS), y1=Math.floor((e.y+e.h-0.01)/TS);
  if(e.vx>0){ const tx=Math.floor((nx+e.w-0.01)/TS); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ nx=tx*TS-e.w; e.vx=0; e.hitWall=1; break; } }
  else if(e.vx<0){ const tx=Math.floor(nx/TS); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ nx=(tx+1)*TS; e.vx=0; e.hitWall=-1; break; } }
  e.x=nx;
  const prevBottom=e.y+e.h; let ny=e.y+e.vy*dt; e.onGround=false; e.landedOn=null;
  const x0=Math.floor(e.x/TS), x1=Math.floor((e.x+e.w-0.01)/TS);
  if(e.vy>0){ const ty=Math.floor((ny+e.h-0.01)/TS); for(let tx=x0;tx<=x1;tx++){ if(solidAt(tx,ty)&&ty>=0&&ty<LH || (oneWayAt(tx,ty)&&prevBottom<=ty*TS+0.5)){ ny=ty*TS-e.h; e.vy=0; e.onGround=true; e.landedOn=gAt(tx,ty); break; } } }
  else if(e.vy<0){ const ty=Math.floor(ny/TS); for(let tx=x0;tx<=x1;tx++){ if(solidAt(tx,ty)){ ny=(ty+1)*TS; e.vy=0; break; } } }
  e.y=ny;
}
function overlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function ledgeAhead(e){ const fx=e.dir>0?e.x+e.w+1:e.x-1; const tx=Math.floor(fx/TS), ty=Math.floor((e.y+e.h+2)/TS); return !(solidAt(tx,ty)||oneWayAt(tx,ty)); }
function wander(e,sp,dx){ if(Math.abs(dx)<44) e.dir=-(Math.sign(dx)||1); else if(Math.random()<0.006) e.dir*=-1; patrol(e,sp); }
function patrol(e,sp){ if(e.onGround&&(ledgeAhead(e)||e.hitWall)) e.dir*=-1; e.vx=e.dir*sp; }

  if(j.content==='coins'){ for(let i=0;i<3;i++) W.drops.push({x:j.x+3,y:j.y,w:6,h:6,vx:(Math.random()*2-1)*60,vy:-170-Math.random()*80,t:0,taken:false,fresh:true,ph:Math.random()*6,onGround:false,hitWall:0}); }
  else if(j.content==='snake'){ const P=W.P; const s=enemy('snake',j.x-4,j.y+j.h,20,8); s.x=j.x-4; s.y=j.y+j.h-8; s.dir=P.x<j.x?-1:1; W.enemies.push(s); }
}
function collectCoin(fresh,x,y){ game.wallet++; game.score+=10; if(fresh) game.collected++; sfx.coin(); burst(x,y,4,['#f2dc94','#d6ae4a'],40); }

function interact(){
  const P=W.P;
  if(P.atkT>0){ const hb={x:P.dir>0?P.x+P.w-2:P.x-24,y:P.y+8,w:26,h:19};
    for(const e of W.enemies){ if(e.gone||e.dead) continue; if(e.lastSwing===P.swingId) continue; if(overlap(hb,e)){ e.lastSwing=P.swingId; hitEnemy(e,P.dir,false); } }
    for(const j of W.jars) if(!j.broken&&overlap(hb,j)) breakJar(j);
    for(const g of W.eggs) if(g.state==='idle'&&overlap(hb,g)){ g.state='done'; game.score+=10; sfx.brk(); burst(g.x+6,g.y+6,10,['#4a2a4a','#8a5a8a','#5a0a10'],70,30); }
  }
  for(const e of W.enemies){ if(e.gone||e.dead||e.stun>0||e.rise>0) continue; if(!overlap(P,e)) continue;
    if(P.vy>40&&P.prevBottom<=e.y+6&&!(P.knock>0)&&Math.abs((P.x+P.w/2)-(e.x+e.w/2))<e.w/2-1){ hitEnemy(e,(P.x+P.w/2<e.x+e.w/2)?1:-1,true); P.vy=input.jump?-300:-230; P.bouncing=true; continue; }
    if(e.type==='thief'){ if(!(e.flee>0)) steal(e); continue; }
    hurt(e);
  }
  for(const c of W.coins) if(!c.taken&&overlap(P,c)){ c.taken=true; collectCoin(true,c.x+3,c.y+3); }
  for(const d of W.drops) if(!d.taken&&d.t>0.25&&overlap(P,d)){ d.taken=true; collectCoin(d.fresh,d.x+3,d.y+3); }
  for(const h of W.hearts) if(!h.taken&&overlap(P,h)){ h.taken=true; if(P.hearts<DIFF.hearts) P.hearts++; else game.score+=25; sfx.heart(); quip('heart',true); }
  for(const c of W.citizens) if(!c.freed&&overlap(P,c)){ c.freed=true; c.anim=0; c.vx=-30; game.rescued++; game.score+=100; sfx.rescue(); burst(c.x+6,c.y,8,['#e8e0c8','#d6ae4a'],50,30); say(c,CIT[(game.rescued-1)%CIT.length],2,true); later(1.1,()=>quip('rescue',true)); }
  for(const k of W.checkpoints) if(!k.active&&overlap(P,k)){ k.active=true; game.cp={x:k.sx,y:k.sy}; sfx.check(); burst(k.x+5,k.y,8,['#ffcf7a','#fff0c0'],40,20); quip('check',true); }
  if(W.goal&&!W.goal.done&&P.x+P.w>W.goal.x+14){ W.goal.done=true; win(); }
}

  if(B.st==='kneel'){ B.vy=Math.min(B.vy+900*dt,420); move(B,dt); const Dg=W.dol; if(Dg){ Dg.anim+=dt;

  B.t-=dt; B.anim+=dt; if(B.inv>0) B.inv-=dt; if(B.flash>0) B.flash-=dt;
  const dx=(P.x+P.w/2)-(B.x+B.w/2);
  if(B.st==='talk'){ B.vx=0; B.dir=Math.sign(dx)||B.dir; B.vy=Math.min(B.vy+900*dt,420); move(B,dt); return; }
  if(CUR.boss.kind==='donation') updDonation(B,dt,dx); else if(CUR.boss.kind==='zarion') updZarion(B,dt,dx); else if(CUR.boss.kind==='jashild') updJashild(B,dt,dx); else
  switch(B.st){
    case 'intro': B.vx=0; B.dir=Math.sign(dx)||B.dir; if(B.t<=0) bossNext(B,'walk',1+Math.random()*0.6); break;
    case 'walk': B.dir=Math.sign(dx)||B.dir; B.vx=B.dir*(B.phase2?62:46);

    case 'slash': B.vx=B.dir*50; if(B.t<=0){ bossNext(B,'recover',B.phase2?0.75:1.0); shake=0.15; sfx.thud(); burst(B.x+B.w/2+B.dir*26,B.y+B.h,8,['#cfa878','#a57d56'],60,40); } break;
    case 'recover': B.vx=0; if(B.t<=0) bossNext(B,'walk',0.8+Math.random()*0.6); break;
    case 'chargeWind': B.vx=0; B.dir=Math.sign(dx)||B.dir; if(Math.random()<0.3) burst(B.x+B.w/2-B.dir*8,B.y+B.h,1,['#cfa878'],30,10); if(B.t<=0){ bossNext(B,'charge',1.8); sfx.roar(); } break;
    case 'charge': B.vx=B.dir*(B.phase2?235:200); if(Math.random()<0.5) burst(B.x+B.w/2-B.dir*8,B.y+B.h,1,['#cfa878','#a57d56'],40,15);
      if(B.hitWall){ bossNext(B,'dizzy',1.6); shake=0.35; sfx.thud(); B.vx=-B.dir*70; B.vy=-140; burst(B.x+B.w/2+B.dir*10,B.y+8,10,['#cfa878','#e8c898'],80,20); }
      else if(B.t<=0) bossNext(B,'recover',0.8); break;
    case 'dizzy': B.vx*=0.92; if(B.t<=0) bossNext(B,'walk',1); break;
    case 'leapWind': B.vx=0; B.dir=Math.sign(dx)||B.dir; if(B.t<=0){ B.vy=-340; B.vx=Math.max(-170,Math.min(170,dx*1.5)); bossNext(B,'leap',3); } break;
    case 'leap': if(B.onGround&&B.t<2.85){ shake=0.4; sfx.thud(); for(const d of [-1,1]) W.waves.push({x:B.x+B.w/2-5,y:B.y+B.h-8,w:10,h:8,dir:d,life:1.0}); burst(B.x+B.w/2,B.y+B.h,14,['#cfa878','#a57d56'],90,40); bossNext(B,'recover',0.95); } break;
  }

    else if(!vulnerable) hurt(B);

  for(let i=W.waves.length-1;i>=0;i--){ const w=W.waves[i]; w.x+=w.dir*150*dt; w.life-=dt; if(w.life<=0||solidAt(Math.floor((w.x+w.w/2)/TS),Math.floor((w.y+4)/TS))){ W.waves.splice(i,1); continue; } if(P.onGround&&overlap(P,w)) hurt(w); if(Math.random()<0.4) W.particles.push({x:w.x+Math.random()*10,y:w.y+6,vx:0,vy:-40,life:0.3,col:'#cfa878',g:100}); }

function updJashild(B,dt,dx){ const P=W.P, adx=Math.abs(dx);
  switch(B.st){
    case 'intro': B.vx=0; B.dir=Math.sign(dx)||B.dir; if(B.t<=0) bossNext(B,'walk',0.8); break;
    case 'walk': { B.dir=Math.sign(dx)||B.dir; const want=adx>100?1:(adx<64?-1:0); B.vx=B.dir*want*(B.phase2?80:62);
      if(adx<36&&B.onGround){ B.vy=-270; B.vx=-B.dir*160; bossNext(B,'leapBack',2); break; }
      if(B.t<=0){ if(B.phase2&&Math.random()<0.4&&adx<130) bossNext(B,'spinWind',0.5); else bossNext(B,'whipWind',B.phase2?0.4:0.55); } break; }
    case 'leapBack': if(B.onGround&&B.t<1.85){ B.vx=0; bossNext(B,'whipWind',0.35); } break;
    case 'whipWind': B.vx=0; B.dir=Math.sign(dx)||B.dir; if(B.t<=0){ bossNext(B,'whip',0.34); sfx.swing2(); B.whipHit=false; B.cracked=false; } break;
    case 'whip': { B.vx=0; const p=1-B.t/0.34; B.whipLen=Math.min(1,p*2.4)*88; const hx=B.dir>0?B.x+B.w+1:B.x-1, hy=B.y+12; const r={x:B.dir>0?hx:hx-B.whipLen,y:hy-4,w:B.whipLen,h:9};
      if(!B.whipHit&&overlap(P,r)&&P.inv<=0){ B.whipHit=true; hurt(B); P.vx=-B.dir*240; P.vy=-110; }
      if(p>0.42&&!B.cracked){ B.cracked=true; sfx.crack(); burst(hx+B.dir*88,hy,6,['#fff0d0','#f0a0c0'],60); }
      if(B.t<=0){ B.whipLen=0; bossNext(B,'recover',B.phase2?0.75:1.0); } break; }
    case 'recover': B.vx=0; if(B.t<=0) bossNext(B,'walk',0.9+Math.random()*0.7); break;
    case 'spinWind': B.vx=0; if(B.t<=0){ bossNext(B,'spin',1.2); sfx.swing2(); } break;
    case 'spin': { B.dir=Math.sign(dx)||B.dir; B.vx=B.dir*45; const c1x=B.x+B.w/2, c1y=B.y+B.h/2, d=Math.hypot(P.x+P.w/2-c1x,P.y+P.h/2-c1y); if(d>14&&d<60&&P.inv<=0){ hurt(B); P.vx=(P.x>B.x?1:-1)*200; }
      if(Math.random()<0.15) sfx.crack(); if(B.t<=0) bossNext(B,'dizzy',1.4); break; }
    case 'dizzy': B.vx*=0.9; if(B.t<=0) bossNext(B,'walk',1); break;
  }
}
function drawJashild(B,t){ const flip=B.dir<0;
  R(B.x,B.y+B.h-1,B.w,2,'rgba(40,10,30,0.4)');
  ctx.globalAlpha=B.fade; if(B.dead){ ctx.save(); ctx.translate(0,Math.round(2*B.y+B.h)); ctx.scale(1,-1); }
  const walking=Math.abs(B.vx)>5; const fr=Math.floor(B.anim*8)%2; const spr=walking&&fr?SPR.jash2:SPR.jash1;
  const hx=B.dir>0?B.x+B.w+1:B.x-1, hy=B.y+12, W1='#3a2418', TIP='#e8d8c0';
  if(B.st==='whip'&&B.whipLen>0){ const L=B.whipLen; for(let i=0;i<L;i++){ const yy=hy+Math.round(Math.sin(i*0.25-t*30)*2*(1-i/L)); R(hx+B.dir*i,yy,1,2,i>L-4?TIP:W1); } }
  else if(B.st==='whipWind'||B.st==='spinWind'){ for(let i=0;i<26;i++){ R(hx-B.dir*Math.round(i*0.6),hy-Math.round(i*0.9)+Math.round(Math.sin(i*0.4+t*8)*1),1,2,i>23?TIP:W1); } }
  else if(B.st==='spin'){ const c1x=B.x+B.w/2, c1y=B.y+B.h/2; for(let k=0;k<3;k++){ const a0=t*14+k*2.1; for(let i=0;i<18;i++){ const a=a0+i*0.06, r=20+i*2.2; R(c1x+Math.cos(a)*r,c1y+Math.sin(a)*r*0.55,2,2,i>15?TIP:W1); } } }
  else { for(let i=0;i<14;i++){ const a=i*0.55; R(hx+B.dir*Math.round(2+Math.cos(a)*3),hy+3+i*0.9+Math.round(Math.sin(a)*2),1,1,W1); } }
  drawSpr(spr,B.x-4,B.y-1,flip);
  if(B.flash>0){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.6; drawSpr(spr,B.x-4,B.y-1,flip); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=B.fade; }
  if(B.dead) ctx.restore(); ctx.globalAlpha=1;
  if(B.st==='dizzy'&&!B.dead){ for(let i=0;i<4;i++){ const a=t*6+i*1.6; R(B.x+B.w/2+Math.cos(a)*8,B.y-6+Math.sin(a)*2,2,2,'#f0e8c8'); } }
  if((B.st==='whipWind'||B.st==='spinWind')&&!B.dead){ const ax=Math.round(B.x+B.w/2)-1, ay=Math.round(B.y-14); R(ax,ay,3,6,'#e04040'); R(ax,ay+8,3,3,'#e04040'); }
}


function updZarion(B,dt,dx){ const P=W.P, adx=Math.abs(dx);
  switch(B.st){
    case 'walk': B.dir=Math.sign(dx)||B.dir; B.vx=(adx<36?-1:adx>110?1:0)*B.dir*34;
      if(B.t<=0){ const r=Math.random(); if(B.minions<3&&r<0.25) bossNext(B,'summonWind',0.7); else if(B.phase2&&r<0.5) bossNext(B,'novaWind',0.6); else if(r<0.8) bossNext(B,'castWind',B.phase2?0.6:0.75); else bossNext(B,'tpOut',0.45); } break;
    case 'castWind': B.vx=0; B.dir=Math.sign(dx)||B.dir; if(B.t<=0){ const n=B.phase2?2:1; for(let i=0;i<n;i++){ const ang=Math.atan2((P.y+P.h/2)-(B.y+11),(P.x+P.w/2)-(B.x+B.w/2))+(i-(n-1)/2)*0.32; W.bolts.push({x:B.x+B.w/2+B.dir*10,y:B.y+11,vx:Math.cos(ang)*115,vy:Math.sin(ang)*115,life:2.4}); } sfx.fire(); bossNext(B,'recover',B.phase2?1.2:1.5); } break;
    case 'recover': B.vx=0; if(B.t<=0) bossNext(B,'walk',0.7+Math.random()*0.6); break;
    case 'summonWind': B.vx=0; if(B.t<=0){ for(const off of [-70,70]){ const sx=Math.max((CUR.boss.x0+2)*TS,Math.min((LW-3)*TS,B.x+off)); const e=enemy(Math.random()<0.5?'zombie':'skel',sx,CUR.boss.gy*TS,14,28); e.x=sx; e.rise=0.8; e.minion=true; W.enemies.push(e); } B.minions+=2; sfx.roar(); bossNext(B,'recover',1.0); } break;
    case 'tpOut': B.vx=0; if(B.t<=0){ const sp=CUR.boss.spots; const gsp=sp.filter(q=>q[1]===CUR.boss.gy), pool=B.phase2?sp:gsp; let s=pool[0]; for(let k=0;k<8;k++){ s=pool[Math.floor(Math.random()*pool.length)]; if(Math.abs(s[0]*TS-B.x)>48) break; } burst(B.x+B.w/2,B.y+B.h/2,12,['#ff7a2a','#3a1a10'],60); B.x=s[0]*TS; B.y=s[1]*TS-B.h; B.vy=0; sfx.tp(); burst(B.x+B.w/2,B.y+B.h/2,12,['#ff7a2a','#ffd080'],60); bossNext(B,'tpIn',0.3); } break;
    case 'tpIn': B.vx=0; B.dir=Math.sign(dx)||B.dir; if(B.t<=0) bossNext(B,'recover',1.4); break;
    case 'novaWind': B.vx=0; if(B.t<=0){ B.nova=4; sfx.fire(); shake=0.3; bossNext(B,'nova',0.65); } break;
    case 'nova': B.vx=0; B.nova+=dt*110; { const d=Math.hypot(P.x+P.w/2-(B.x+B.w/2),P.y+P.h/2-(B.y+B.h/2)); if(Math.abs(d-B.nova)<10&&P.inv<=0) hurt(B); } if(B.t<=0){ B.nova=0; bossNext(B,'dizzy',1.4); } break;
    case 'dizzy': B.vx*=0.9; if(B.t<=0) bossNext(B,'walk',1); break;
    default: bossNext(B,'walk',0.8);
